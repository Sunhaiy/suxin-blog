services:
  db:
    image: docker.m.daocloud.io/library/postgres:16
    container_name: suxin-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suxin-blog-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/public/uploads
      UPLOAD_PUBLIC_PATH: /uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./deploy-assets:/app/deploy-assets:ro

  caddy:
    image: docker.m.daocloud.io/library/caddy:2-alpine
    container_name: suxin-blog-caddy
    restart: unless-stopped
    depends_on:
      - app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
